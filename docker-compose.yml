# Stack completa do Espaço do Rodolfo + Barney — ZERO configuração obrigatória.
#
# No Dokploy: Create Application → tipo **Docker Compose** → repositório
# `Flowfoods/flowfoods`, branch do Barney, compose path `docker-compose.yml`
# → Deploy. Só isso.
#
# Os segredos são gerados NO PRIMEIRO BOOT pelo serviço `segredos` e guardados
# num volume — sobrevivem a redeploy e nunca passam por chat, arquivo no Git ou
# área de transferência. O link de primeiro acesso (com o token de setup)
# aparece no LOG do serviço `web`, que o Rodolfo abre pelo painel.
#
# Qualquer variável definida no painel do Dokploy VENCE o volume (a precedência
# está em scripts/exportar-segredos.sh). Ou seja: zero-config por padrão,
# override por painel quando precisar — as EVOLUTION_* entram assim mais tarde.
#
# Ordem de subida: segredos → postgres (healthcheck) → migrar → web/worker.
# `migrar` é um serviço de uma vez só: aplica as migrations e, só se elas
# terminarem bem, web e worker sobem (Ponto 20 do plano: nenhum processo roda
# sobre estrutura de banco incompatível — antes o worker não esperava). Em
# seguida ele roda o conferidor (Ponto 15): pendência em dado antigo aparece
# no log do `migrar`, sem apagar, converter nem corrigir nada, e sem derrubar
# o site.

services:
  # Gera os segredos que ainda não existem e termina. Idempotente: num volume
  # já populado, não toca em nada — redeploy não rotaciona segredo.
  segredos:
    image: alpine:3.20
    command: >
      sh -c 'set -e; cd /segredos;
      for f in postgres_password nextauth_secret admin_setup_token leads_import_token webhook_secret integracao_chave_cifragem; do
      if [ ! -s "$$f" ]; then head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > "$$f"; echo "[segredos] gerado: $$f"; fi;
      done;
      chmod 644 postgres_password nextauth_secret admin_setup_token leads_import_token webhook_secret integracao_chave_cifragem;
      echo "[segredos] prontos"'
    volumes:
      - segredos:/segredos
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      segredos:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: flowfoods
      POSTGRES_DB: flowfoods
      # A imagem oficial lê a senha de arquivo — é o que liga o Postgres ao
      # mesmo segredo que o web usa para montar a DATABASE_URL.
      POSTGRES_PASSWORD_FILE: /segredos/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - segredos:/segredos:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowfoods -d flowfoods']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Aplica as migrations e termina. Falhou = web e worker NÃO sobem. Atenção:
  # num deploy com código novo o Compose recria web e worker ANTES de esperar
  # o `migrar`, então migration que falha deixa o site FORA até resolver
  # (melhor fora com o motivo no log do que rodando sobre estrutura pela
  # metade). Como destravar: docs/RUNBOOK.md, seção 1.2.
  # Depois, o conferidor lê o catálogo do Postgres e lista o que ficou
  # pendente em dado antigo (CHECK NOT VALID, índice que faltou): código 1 =
  # pendência a resolver pela equipe; código 2 = não conseguiu conferir. Os
  # dois só ficam registrados aqui e não bloqueiam. Tempo máximo de 120 s: com
  # o site parado esperando, o conferidor não pode pendurar o deploy.
  migrar:
    # Mesma imagem do `web` (construída lá, uma vez por deploy). Sem build
    # aqui de propósito: ver o comentário no `web`.
    image: flowfoods-web:local
    pull_policy: never
    restart: 'no'
    depends_on:
      segredos:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: >
      sh -c '. ./scripts/exportar-segredos.sh
      && npx prisma migrate deploy
      && echo "[migrar] migrations aplicadas"
      && (timeout 120 npm run --silent erp:conferir-migracao;
      c=$$?; if [ "$$c" = 1 ]; then echo "[migrar] ATENÇÃO: a conferência pós-migration listou pendências (acima). O site sobe; resolva conforme docs/RUNBOOK.md.";
      elif [ "$$c" != 0 ]; then echo "[migrar] ATENÇÃO: não consegui conferir as migrations (código $$c; 124 = passou de 120 s). O site sobe; rode npm run erp:conferir-migracao à mão."; fi;
      true)'
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - segredos:/segredos:ro

  web:
    # O ÚNICO serviço com build. migrar e worker usam a mesma imagem pelo
    # nome. Antes os três tinham build do mesmo Dockerfile: o Compose gerava
    # três imagens (o BuildKit reaproveita as camadas, mas isso depende da
    # versão do Docker). Assim é um build por deploy, garantido, e os três
    # sempre na mesma versão. pull_policy: never nos outros dois impede o
    # Compose de procurar essa imagem no Docker Hub — ela só existe local.
    build:
      context: .
      dockerfile: Dockerfile
    image: flowfoods-web:local
    restart: unless-stopped
    depends_on:
      segredos:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    # 1. carrega os segredos (painel vence o volume) · 2. imprime o link de
    # setup no log enquanto não houver admin · 3. sobe o Next. A migration já
    # rodou no `migrar` (este serviço só sobe se ela terminou bem).
    command: >
      sh -c '. ./scripts/exportar-segredos.sh
      && node scripts/imprimir-setup.mjs
      && npm start'
    environment:
      # Passthrough do painel. Vazias = dry-run (não envia nada) e sem IA.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      LEADS_IMPORT_TOKEN: ${LEADS_IMPORT_TOKEN:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-flowfoods-prospeccao}
      EVOLUTION_NOTIFY_INSTANCE: ${EVOLUTION_NOTIFY_INSTANCE:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      RODOLFO_WHATSAPP: ${RODOLFO_WHATSAPP:-5521996416060}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DAILY_BUDGET_BRL: ${AI_DAILY_BUDGET_BRL:-5}
      USD_BRL: ${USD_BRL:-5.40}
      # ERP do parceiro, "entrar com o rosto": vazias = mesmo endereço do NEXTAUTH_URL.
      ERP_WEBAUTHN_ORIGIN: ${ERP_WEBAUTHN_ORIGIN:-}
      ERP_WEBAUTHN_RP_ID: ${ERP_WEBAUTHN_RP_ID:-}
      # Portal do cliente: onde os arquivos enviados caem.
      PORTAL_UPLOAD_DIR: /data/portal
      # ERP: fotos das fichas técnicas (/data/erp/<parceiro>/fichas/).
      ERP_ARQUIVOS_DIR: /data/erp
    volumes:
      - segredos:/segredos:ro
      # Arquivos do Portal do cliente (/data/portal/<token>/<bloco>/). Volume
      # nomeado: sobrevive a redeploy. Sem ele, cada deploy apagaria a
      # planilha que o cliente mandou.
      - portal-uploads:/data/portal
      # Fotos das fichas técnicas do ERP. Volume nomeado: sobrevive a redeploy.
      - erp-arquivos:/data/erp
    expose:
      - '3000'
    # O domínio se configura no painel do Dokploy (serviço web, porta 3000).
    # Não escreva label de Traefik aqui — duas fontes de verdade para o mesmo
    # host é como se perde um domínio.

  worker:
    image: flowfoods-web:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      segredos:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # O worker lê e grava no banco: só sobe depois da migration (Ponto 20).
      migrar:
        condition: service_completed_successfully
    command: >
      sh -c '. ./scripts/exportar-segredos.sh && npm run worker'
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-flowfoods-prospeccao}
      EVOLUTION_NOTIFY_INSTANCE: ${EVOLUTION_NOTIFY_INSTANCE:-}
      RODOLFO_WHATSAPP: ${RODOLFO_WHATSAPP:-5521996416060}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DAILY_BUDGET_BRL: ${AI_DAILY_BUDGET_BRL:-5}
      USD_BRL: ${USD_BRL:-5.40}
      # Central de Integrações (INT-1.2). Desligada por padrão: só "true" liga. O segredo do app vem do painel (nunca do
      # Git); a chave de cifragem do token sai do volume de segredos (o painel vence). Só o worker recebe estas variáveis no
      # ambiente: SERVICO_DA_INTEGRACAO=1 faz o exportar-segredos.sh carregar a chave aqui e só aqui (decisão 487).
      SERVICO_DA_INTEGRACAO: "1"
      INTEGRACAO_IFOOD_ATIVA: ${INTEGRACAO_IFOOD_ATIVA:-false}
      INTEGRACAO_CHAVE_CIFRAGEM: ${INTEGRACAO_CHAVE_CIFRAGEM:-}
      IFOOD_API_BASE: ${IFOOD_API_BASE:-https://merchant-api.ifood.com.br}
      IFOOD_TEST_CLIENT_SECRET: ${IFOOD_TEST_CLIENT_SECRET:-}
      IFOOD_BI_CLIENT_SECRET: ${IFOOD_BI_CLIENT_SECRET:-}
    volumes:
      - segredos:/segredos:ro
    # Sem porta e sem domínio: o worker não atende requisição nenhuma.

volumes:
  postgres-data:
  segredos:
  portal-uploads:
  erp-arquivos:
