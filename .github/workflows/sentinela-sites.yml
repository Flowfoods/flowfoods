name: Sentinela dos sites

# Em 23/10/2026 todos os sites ficaram fora por horas e ninguém soube: a
# máquina voltou do reboot, mas o Traefik não. Este job roda a prova
# (DNS, conexão, TLS validado, HTTP, página esperada) e fica VERMELHO quando
# algum domínio real está fora — o GitHub manda e-mail de falha.
#
# Só lê. Não reinicia nada. Agendamento só vale depois do merge na master.
# Custo: ~1 min de runner por execução (de hora em hora ≈ 720 min/mês).

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinela-sites
  cancel-in-progress: true

jobs:
  provar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prova site por site
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          FALHAR_SE_FORA: '1'
        run: bash scripts/reerguer-vps.sh provar
