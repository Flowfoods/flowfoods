name: O que está no ar

# Ninguém conseguia responder "o site publicado já está com o meu commit?".
# O ambiente onde este repo é desenvolvido não alcança o domínio (o proxy de
# saída recusa o CONNECT), e o painel do Dokploy também não. O runner do
# GitHub alcança — então a conferência mora aqui.
#
# Só lê: um GET em duas páginas públicas. Não publica, não deploya, não toca
# em segredo. Nunca reprova o build: "o site ainda está na versão antiga" não
# é defeito de código, é deploy que não rodou — pintar de vermelho por isso
# vira ruído e o portão perde valor.
#
# Rodar: aba Actions -> "O que está no ar" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  conferir:
    name: Ler consultoriaflowfoods.com.br
    runs-on: ubuntu-latest
    steps:
      - name: Conferir a home
        run: |
          set -uo pipefail
          SITE=https://consultoriaflowfoods.com.br

          ler() {
            # $1 = caminho. Guarda corpo e código; segue redirect (-L) porque
            # www -> raiz é normal e não deve ser lido como página quebrada.
            curl -sSL --max-time 30 -o /tmp/corpo.html -w '%{http_code}' "$SITE$1" 2>/dev/null || echo "000"
          }

          # Os marcadores são LITERAIS (grep -F) e precisam ser inequívocos.
          # A primeira versão deste passo errou justamente aí: procurava "100+",
          # que casa dentro de "1000+", e "rrodolfoac", que casa dentro do gmail
          # antigo "rrodolfoacifood@". Os dois davam SIM lendo o texto que a F1
          # veio REMOVER. Rodando contra o build local — onde a F1 já está — o
          # erro não aparecia: só uma página velha de verdade o revela.
          deve() {
            # $1 = texto que precisa ESTAR na página depois de publicado
            if grep -qF "$1" /tmp/corpo.html; then echo "  [ no ar  ] $2"; else echo "  [PENDENTE] $2"; fi
          }
          sumiu() {
            # $1 = texto que precisa TER SUMIDO da página depois de publicado
            if grep -qF "$1" /tmp/corpo.html; then echo "  [PENDENTE] $2 — ainda na página"; else echo "  [ no ar  ] $2 — removido"; fi
          }

          echo "== HOME =="
          codigo=$(ler "/")
          echo "HTTP $codigo   ($(wc -c < /tmp/corpo.html) bytes)"
          if [ "$codigo" = "200" ]; then
            echo
            echo "  este repositório constrói este site?"
            deve 'Gastronomia que flui' 'slogan do repositório'
            echo
            echo "  site de 25/09 (identidade FlowFoods)"
            deve 'Seis frentes'              'seção das frentes'
            deve 'href="/rodolfo/login"'     'botão Entrar para o painel'
            sumiu 'href="/diagnostico"'      'oferta de diagnóstico gratuito'
            deve  'id="entregas"'            'seção "o que a casa recebe"'
            sumiu 'visitas presenciais'      'termos comerciais (ficam na proposta)'
            echo
            echo "  credibilidade (F1)"
            sumiu '1000+'                    'número sem prova'
            sumiu 'rrodolfoacifood@gmail.com' 'gmail pessoal como contato comercial'
            sumiu 'Vagas limitadas'          'escassez inventada'
            deve  'instagram.com/rrodolfoac' 'handle certo do Instagram'
          fi

          echo
          echo "== /diagnostico (apagado em 25/09) =="
          codigo=$(ler "/diagnostico")
          echo "HTTP $codigo"
          if [ "$codigo" = "404" ]; then
            echo "::notice title=Site de 25/09 no ar::/diagnostico responde 404 — a versão publicada é a atual."
          else
            echo "::notice title=Versão antiga no ar::/diagnostico respondeu $codigo. Falta o Dokploy subir a nova versão."
          fi
