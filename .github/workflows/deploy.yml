name: Portão e deploy

# O deploy deixa de depender de alguém abrir o painel: todo push em `master`
# roda o portão e, passando, chama o webhook do Dokploy.
#
# O deploy usa a API do Dokploy com os mesmos segredos do barney-ops
# (DOKPLOY_URL e DOKPLOY_API_TOKEN): dispara `compose.deploy` do app
# `flowfoods-web`, criado em 25/09. Sem os segredos, avisa e sai com sucesso —
# o portão continua protegendo `master`.
#
# DOKPLOY_DEPLOY_WEBHOOK (a URL de webhook do painel) ainda é aceito como
# alternativa, se um dia for cadastrado.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  portao:
    name: Portão (lint · tipos · testes com banco · build)
    runs-on: ubuntu-latest
    # Ponto 4 do plano: os testes de integridade (isolamento entre parceiros e
    # lojas, RLS, compra que não duplica, concorrência, migrations com dado
    # antigo) precisam RODAR antes de publicar. Sem banco eles eram pulados e o
    # portão ficava verde assim mesmo. Agora há um Postgres de serviço; falha
    # aqui = o deploy (que depende deste job) não sai.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ff
          POSTGRES_PASSWORD: ff
          POSTGRES_DB: ff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ff -d ff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_DB_TESTE: postgresql://ff:ff@localhost:5432/ff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # A imagem de produção é node:22; o CI usa a mesma versão.
          node-version: '22'
          cache: npm
      - run: npm ci
      # Contrato de correlação/timeout com HTTP inteiramente simulado.
      - name: Contrato da confirmação de deploy
        run: node --test tests/deploy-confirmacao.node.mjs
      - name: Lint
        run: npm run lint
      # O portão de conteúdo veio com a F1 do Caminho 1 e rodava só à mão.
      # Ele existe justamente porque build e tipos não enxergam credibilidade:
      # "1000+" compila igual a "100+". Rodando aqui, ele passa a valer.
      - name: Portão de conteúdo
        run: npm run gate
      - name: Tipos
        run: npx tsc --noEmit
      # Os testes de migration usam o `psql` do runner; sem ele, seriam pulados
      # e o portão ficaria verde. Se um dia sumir da imagem, falha aqui.
      - name: psql disponível
        run: psql --version
      # Papéis públicos de fixtures, só no serviço descartável acima. As
      # migrations dos cenários criam seus próprios bancos, com donos sem
      # SUPERUSER/BYPASSRLS: um pode SET erp_tenant e o outro não pode.
      - name: Banco de teste (três perfis obrigatórios)
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = 'true'
          psql 'postgresql://ff:ff@localhost:5432/ff' -X -v ON_ERROR_STOP=1 \
            -v ci_postgres_efemero=github-actions-service-postgres16 \
            -f scripts/preparar-banco-teste.sql
          # Existir no catálogo não basta: confirmar autenticação com as
          # mesmas fixtures que os testes de migration usam. Erro aborta o job.
          for papel in ff_dono ff_semrls; do
            PGPASSWORD="$papel" psql -h localhost -p 5432 -U "$papel" -d ff \
              -X --no-password -v ON_ERROR_STOP=1 -c 'SELECT current_user' > /dev/null
          done
      - name: Banco de teste (migrations)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ff:ff@localhost:5432/ff?schema=public
      # A suíte inteira, com banco. Os testes de migration criam bancos próprios
      # pelo administrador do serviço e aplicam/validam as migrations nos três
      # perfis. A preparação acima falha se os donos sem superusuário faltarem.
      - name: Testes (com banco)
        run: |
          set -o pipefail
          npx vitest run --no-file-parallelism 2>&1 | tee /tmp/testes.txt
      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo '### Testes do portão (com Postgres)'
            echo
            sed -E 's/\x1b\[[0-9;]*m//g' /tmp/testes.txt 2>/dev/null | grep -E 'Test Files|Tests ' || echo 'Sem resultado: os testes não chegaram a rodar.'
            echo
            echo 'O serviço efêmero prepara os três perfis: superusuário, dono com SET erp_tenant/FORCE RLS e dono sem RLS. Falha de preparação ou de teste bloqueia o deploy. Não executado não é aprovado.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build de produção
        run: npm run build

  deploy:
    name: Deploy no Dokploy
    needs: portao
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: flowfoods-compose-JWsPI2ZLgUrh11MS_EwwB
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disparar e acompanhar o deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          COMPOSE_ID: JWsPI2ZLgUrh11MS_EwwB
        run: node scripts/disparar-deploy.mjs
