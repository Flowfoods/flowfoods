name: Portão e deploy

# O deploy deixa de depender de alguém abrir o painel: todo push em `master`
# roda o portão e, passando, chama o webhook do Dokploy.
#
# O deploy usa a API do Dokploy com os mesmos segredos do barney-ops
# (DOKPLOY_URL e DOKPLOY_API_TOKEN): dispara `compose.deploy` do app
# `flowfoods-web`, criado em 25/09. Sem os segredos, avisa e sai com sucesso —
# o portão continua protegendo `master`.
#
# DOKPLOY_DEPLOY_WEBHOOK (a URL de webhook do painel) ainda é aceito como
# alternativa, se um dia for cadastrado.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  portao:
    name: Portão (lint · tipos · testes · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # O portão de conteúdo veio com a F1 do Caminho 1 e rodava só à mão.
      # Ele existe justamente porque build e tipos não enxergam credibilidade:
      # "1000+" compila igual a "100+". Rodando aqui, ele passa a valer.
      - name: Portão de conteúdo
        run: npm run gate
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes do motor do Diagnóstico
        run: npm test
      - name: Build de produção
        run: npm run build

  deploy:
    name: Deploy no Dokploy
    needs: portao
    # workflow_dispatch entra na condição para o deploy poder ser re-disparado
    # da aba Actions no instante em que o segredo existir — sem commit vazio só
    # para acordar o webhook. Continua travado na master: dispatch em outra ref
    # roda só o portão.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar o deploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          URL: ${{ secrets.DOKPLOY_URL }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          # composeId do app flowfoods-web no painel (projeto FlowFoods).
          COMPOSE_ID: JWsPI2ZLgUrh11MS_EwwB
        run: |
          set -euo pipefail
          if [ -n "${WEBHOOK:-}" ]; then
            codigo=$(curl -sS -X POST -o /tmp/resposta.txt -w '%{http_code}' --max-time 60 "$WEBHOOK")
          elif [ -n "${URL:-}" ] && [ -n "${TOKEN:-}" ]; then
            BASE=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
            codigo=$(curl -sk -X POST -o /tmp/resposta.txt -w '%{http_code}' --max-time 60 \
                       -H "x-api-key: ${TOKEN}" -H 'Content-Type: application/json' \
                       -d "{\"composeId\":\"${COMPOSE_ID}\"}" "${BASE}/api/compose.deploy")
          else
            echo "::notice title=Deploy não disparado::Faltam DOKPLOY_URL e DOKPLOY_API_TOKEN (ou DOKPLOY_DEPLOY_WEBHOOK). O portão passou; a subida segue manual."
            exit 0
          fi
          echo "Dokploy respondeu HTTP $codigo"
          # A resposta pode trazer id de build; nunca traz segredo — o webhook
          # inteiro vive no secret e não é ecoado.
          head -c 500 /tmp/resposta.txt || true
          echo
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "::error title=Deploy recusado::O Dokploy respondeu $codigo."
            exit 1
          fi
