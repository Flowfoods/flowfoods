# Operações do Barney executadas pelos runners do GitHub.
#
# Por que isto existe: a sessão do Claude não tem rota de rede até a VPS (o
# proxy recusa o túnel), mas os runners do GitHub têm internet aberta — e o
# Claude consegue DISPARAR este workflow e LER os logs pela API do GitHub.
# Ou seja: este arquivo é o par de mãos remoto da sessão.
#
# Nenhum job imprime segredo. O token do Dokploy só viaja em header.
#
# Ações:
#   verificar      — roda scripts/verificar-deploy.sh contra o alvo (sem segredo)
#   descobrir-api  — mapeia a API do Dokploy instalado (exige os 2 secrets)
#   deploy-compose — dispara o deploy de um compose já criado no painel
#   api            — uma chamada qualquer à API do Dokploy (método, caminho,
#                    corpo). É o "par de mãos" para criar app, domínio e
#                    variáveis sem abrir o painel.
#   diagnostico-tls — só leitura: DNS, certificado servido (subject, emissor,
#                    SAN, validade), códigos HTTP/HTTPS da raiz e do www, e no
#                    Dokploy o estado do compose, os domínios ligados e os
#                    últimos deploys. Para quando o navegador diz
#                    ERR_CERT_COMMON_NAME_INVALID (23/10/2026).
#
# Secrets (Settings → Secrets and variables → Actions):
#   DOKPLOY_URL        ex.: https://dokploy.seu-dominio ou http://IP:3000
#   DOKPLOY_API_TOKEN  gerado no Dokploy em Settings → API/CLI

name: barney-ops

on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que executar
        type: choice
        required: true
        default: verificar
        options:
          - verificar
          - descobrir-api
          - deploy-compose
          - api
          - diagnostico-tls
      alvo:
        description: URL do portal (para "verificar")
        type: string
        required: false
        default: https://consultoriaflowfoods.com.br
      compose_id:
        description: composeId do Dokploy (para "deploy-compose" e "diagnostico-tls")
        type: string
        required: false
        default: JWsPI2ZLgUrh11MS_EwwB
      metodo:
        description: Método HTTP (para "api")
        type: choice
        required: false
        default: GET
        options: [GET, POST]
      caminho:
        description: Caminho da API, ex. /api/project.all (para "api")
        type: string
        required: false
      corpo:
        description: Corpo JSON (para "api" com POST)
        type: string
        required: false
      limite:
        description: Máximo de caracteres da resposta a imprimir
        type: string
        required: false
        default: '20000'

permissions:
  contents: read

jobs:
  verificar:
    if: inputs.acao == 'verificar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar o portal
        run: |
          chmod +x scripts/verificar-deploy.sh
          ./scripts/verificar-deploy.sh "${{ inputs.alvo }}"

  descobrir-api:
    if: inputs.acao == 'descobrir-api'
    runs-on: ubuntu-latest
    steps:
      - name: Mapear a API do Dokploy instalado
        env:
          URL: ${{ secrets.DOKPLOY_URL }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::Faltam os secrets DOKPLOY_URL e/ou DOKPLOY_API_TOKEN."
            echo "Crie o token no Dokploy (Settings → API/CLI) e cadastre os dois em"
            echo "Settings → Secrets and variables → Actions deste repositório."
            exit 1
          fi
          # Aceita a URL como for colada: com caminho, âncora, barra final —
          # fica só scheme://host[:porta]. Quem cola é humano com pressa.
          BASE=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "Sondando a API em ${BASE} (token nunca é impresso)"
          echo

          sonda() {
            # $1 = descrição · $2 = método · $3 = caminho · $4 = corpo opcional
            if [ -n "${4:-}" ]; then
              code=$(curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 20 \
                       -X "$2" -H "x-api-key: ${TOKEN}" -H 'Content-Type: application/json' \
                       -d "$4" "${BASE}$3" || echo 000)
            else
              code=$(curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 20 \
                       -X "$2" -H "x-api-key: ${TOKEN}" -H 'Content-Type: application/json' \
                       "${BASE}$3" || echo 000)
            fi
            printf '%-38s %s %-34s -> %s\n' "$1" "$2" "$3" "$code"
            if [ "$code" != "000" ] && [ -s /tmp/corpo ]; then
              head -c 600 /tmp/corpo | tr -d '\000' ; echo; echo '---'
            fi
          }

          sonda 'raiz'                     GET  /
          sonda 'openapi'                  GET  /api/openapi.json
          sonda 'swagger'                  GET  /swagger
          sonda 'settings.health'          GET  /api/settings.health
          sonda 'project.all'              GET  /api/project.all
          sonda 'trpc project.all'         GET  '/api/trpc/project.all?batch=1&input=%7B%7D'
          sonda 'compose.all'              GET  /api/compose.all
          # Corpo vazio de propósito: o 400 de validação do Zod lista os campos
          # que a versão instalada espera — é o "manual" do create sem docs.
          sonda 'project.create (campos?)' POST /api/project.create '{}'
          sonda 'compose.create (campos?)' POST /api/compose.create '{}'
          echo
          echo "Pronto. O Claude lê este log e escreve a chamada exata para a versão instalada."

  deploy-compose:
    if: inputs.acao == 'deploy-compose'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy do compose
        env:
          URL: ${{ secrets.DOKPLOY_URL }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          COMPOSE_ID: ${{ inputs.compose_id }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::Faltam os secrets DOKPLOY_URL e/ou DOKPLOY_API_TOKEN."
            exit 1
          fi
          if [ -z "${COMPOSE_ID:-}" ]; then
            echo "::error::Informe compose_id (aparece na URL do app no painel, ou via descobrir-api)."
            exit 1
          fi
          BASE=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          code=$(curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 60 \
                   -X POST -H "x-api-key: ${TOKEN}" -H 'Content-Type: application/json' \
                   -d "{\"composeId\":\"${COMPOSE_ID}\"}" \
                   "${BASE}/api/compose.deploy" || echo 000)
          echo "POST /api/compose.deploy -> ${code}"
          head -c 600 /tmp/corpo || true; echo
          case "$code" in
            200|201) echo "Deploy disparado." ;;
            *) echo "::error::Não disparou (HTTP ${code}). Rode a ação descobrir-api e me mande o log."; exit 1 ;;
          esac

  api:
    if: inputs.acao == 'api'
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a API do Dokploy
        env:
          URL: ${{ secrets.DOKPLOY_URL }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          METODO: ${{ inputs.metodo }}
          CAMINHO: ${{ inputs.caminho }}
          CORPO: ${{ inputs.corpo }}
          LIMITE: ${{ inputs.limite }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::Faltam os secrets DOKPLOY_URL e/ou DOKPLOY_API_TOKEN."
            exit 1
          fi
          BASE=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          if [ -n "${CORPO:-}" ]; then
            code=$(curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 120 \
                     -X "$METODO" -H "x-api-key: ${TOKEN}" -H 'Content-Type: application/json' \
                     -d "$CORPO" "${BASE}${CAMINHO}" || echo 000)
          else
            code=$(curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 120 \
                     -X "$METODO" -H "x-api-key: ${TOKEN}" "${BASE}${CAMINHO}" || echo 000)
          fi
          echo "${METODO} ${CAMINHO} -> ${code}"
          echo '=== RESPOSTA ==='
          head -c "${LIMITE:-20000}" /tmp/corpo | tr -d '\000'; echo
          echo '=== FIM ==='
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac

  diagnostico-tls:
    if: inputs.acao == 'diagnostico-tls'
    runs-on: ubuntu-latest
    steps:
      # Parte 1 — o que a internet vê. Nada aqui usa segredo.
      - name: DNS, certificado e HTTP da raiz e do www
        env:
          IP_VPS: 76.13.230.78
        run: |
          set -u
          for host in consultoriaflowfoods.com.br www.consultoriaflowfoods.com.br; do
            echo "=================== $host ==================="
            echo "--- DNS (esperado A = ${IP_VPS}, sem AAAA) ---"
            a=$(dig +short A "$host" | tr '\n' ' ')
            aaaa=$(dig +short AAAA "$host" | tr '\n' ' ')
            echo "A:    ${a:-<vazio>}"
            echo "AAAA: ${aaaa:-<vazio>}"
            case " $a " in
              *" ${IP_VPS} "*) echo "DNS: aponta para a VPS" ;;
              *) echo "::warning title=DNS::${host} não aponta para ${IP_VPS} (A = ${a:-vazio})" ;;
            esac
            [ -n "$aaaa" ] && echo "::warning title=DNS::${host} tem AAAA (${aaaa}) — a VPS não atende IPv6 pelo Traefik"
            echo
            echo "--- Certificado servido na 443 (SNI = $host) ---"
            # timeout: um servidor que aceita a conexão e não fecha penduraria o job.
            if timeout 20 openssl s_client -connect "${host}:443" -servername "$host" </dev/null >/tmp/tls.txt 2>&1; then :; fi
            if grep -q 'BEGIN CERTIFICATE' /tmp/tls.txt; then
              openssl x509 -in /tmp/tls.txt -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null \
                || openssl x509 -in /tmp/tls.txt -noout -subject -issuer -dates
              echo "Resultado da verificação: $(grep -m1 'Verify return code' /tmp/tls.txt || echo '?')"
            else
              echo "Sem certificado: $(grep -m1 -iE 'error|refused|timed out' /tmp/tls.txt || head -3 /tmp/tls.txt)"
            fi
            echo
            echo "--- HTTPS (sem seguir redirect) ---"
            curl -sSI --max-time 20 "https://${host}/" 2>&1 | grep -iE '^(HTTP|location|server)' || true
            echo "--- HTTPS ignorando o certificado (o app está atrás?) ---"
            curl -skI --max-time 20 "https://${host}/" 2>&1 | grep -iE '^(HTTP|location|server|x-powered-by)' || true
            echo "--- HTTP (porta 80) ---"
            curl -sSI --max-time 20 "http://${host}/" 2>&1 | grep -iE '^(HTTP|location|server)' || true
            echo "--- Desafio ACME na porta 80 (esperado 404 do Traefik, nunca redirect) ---"
            curl -sSI --max-time 20 "http://${host}/.well-known/acme-challenge/teste" 2>&1 | grep -iE '^(HTTP|location)' || true
            echo
          done
          echo "=================== o IP direto ==================="
          echo "--- sem SNI (certificado padrão do Traefik) ---"
          timeout 20 openssl s_client -connect "${IP_VPS}:443" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null || echo "sem resposta"

      # Parte 2 — o que o Dokploy pensa. Token só em header; nunca ecoado.
      - name: Estado do compose no Dokploy (domínios, deploys)
        env:
          URL: ${{ secrets.DOKPLOY_URL }}
          TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          COMPOSE_ID: ${{ inputs.compose_id }}
        run: |
          set -u
          if [ -z "${URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::warning::Sem DOKPLOY_URL/DOKPLOY_API_TOKEN: pulei a parte do painel."
            exit 0
          fi
          BASE=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          get() {
            # $1 = caminho (com query). Imprime o código e deixa o corpo em /tmp/corpo
            curl -sk -o /tmp/corpo -w '%{http_code}' --max-time 60 \
              -H "x-api-key: ${TOKEN}" "${BASE}$1" || echo 000
          }

          echo "=== compose.one ==="
          code=$(get "/api/compose.one?composeId=${COMPOSE_ID}")
          echo "HTTP $code"
          if [ "$code" = 200 ]; then
            jq '{name, appName, composeStatus, composeType, sourceType, branch, composePath,
                 autoDeploy, createdAt,
                 domains: [.domains[]? | {host, serviceName, port, https, certificateType, path, domainType, createdAt}],
                 deploys_recentes: ([.deployments[]? | {status, title, createdAt, finishedAt, description}]
                                    | sort_by(.createdAt) | reverse | .[0:5])}' /tmp/corpo \
              || head -c 3000 /tmp/corpo
          else
            head -c 1500 /tmp/corpo; echo
          fi

          echo
          echo "=== domain.byComposeId ==="
          code=$(get "/api/domain.byComposeId?composeId=${COMPOSE_ID}")
          echo "HTTP $code"
          [ "$code" = 200 ] && (jq '[.[] | {host, serviceName, port, https, certificateType}]' /tmp/corpo || head -c 2000 /tmp/corpo)

          echo
          echo "=== deployment.all (últimos 5) ==="
          code=$(get "/api/deployment.all?composeId=${COMPOSE_ID}")
          echo "HTTP $code"
          if [ "$code" = 200 ]; then
            jq '[.[] | {deploymentId, status, title, description, createdAt, finishedAt, logPath}] | sort_by(.createdAt) | reverse | .[0:5]' /tmp/corpo || head -c 3000 /tmp/corpo
          else
            head -c 1000 /tmp/corpo; echo
          fi

          echo
          echo "=== project.all: apps que carregam flowfoods no nome (para a rota manual antiga) ==="
          code=$(get "/api/project.all")
          echo "HTTP $code"
          if [ "$code" = 200 ]; then
            jq '[.[] | {projeto: .name,
                        apps: [.applications[]? | select(.name | test("flow"; "i")) | {name, appName, applicationId, applicationStatus}],
                        composes: [.compose[]? | select(.name | test("flow"; "i")) | {name, appName, composeId, composeStatus}]}
                 | select((.apps | length) > 0 or (.composes | length) > 0)]' /tmp/corpo || head -c 2000 /tmp/corpo
            # Rota Traefik manual de cada app "flowfoods" (a lição de 25/09)
            for app in $(jq -r '.[] | .applications[]? | select(.name | test("flow"; "i")) | .applicationId' /tmp/corpo 2>/dev/null); do
              echo
              echo "--- application.readTraefikConfig ($app) ---"
              c=$(get "/api/application.readTraefikConfig?applicationId=${app}")
              echo "HTTP $c"
              [ "$c" = 200 ] && head -c 2500 /tmp/corpo; echo
            done
          fi

